name: Windows portable preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version (for example 0.1.0-alpha.1)
        required: true
        default: 0.1.0-alpha.1
        type: string
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'
      - 'v*-rc.*'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Validate preview version
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$') { throw 'Only preview versions are supported.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build portable ZIP
        run: pnpm package:win --version "$env:RELEASE_VERSION"
      - name: Verify extracted ZIP using bundled Node and isolated user home
        run: pnpm verify:portable --zip "releases/adaptive-tutor-platform-v$env:RELEASE_VERSION-win-x64.zip"
      - name: Browser regression
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: releases/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            releases/*.verification.json
            test-results/

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: releases
      - name: Create draft prerelease (never auto-publish)
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          gh release create "v$version" releases/* --target "$RELEASE_COMMIT" --title "知序 v$version · Windows 便携预览" --draft --prerelease --notes-file packaging/release-notes.md
