name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.1 or 0.1.2-rc.1)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Disable Git autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Validate release version
        id: version
        run: node scripts/release/version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=.release-work/unit-tests.xml
      - name: Build portable ZIP without node_modules
        run: pnpm package:win --version "$env:RELEASE_VERSION"
      - name: Verify extracted ZIP using bundled Node and isolated user home
        run: pnpm verify:portable --zip "releases/adaptive-tutor-platform-v$env:RELEASE_VERSION-win-x64.zip"
      - name: Report artifact size
        shell: pwsh
        run: |
          $report = Get-Content "releases/adaptive-tutor-platform-v$env:RELEASE_VERSION-win-x64.zip.verification.json" -Raw | ConvertFrom-Json
          "| ZIP MiB | Unpacked MiB | Files |" >> $env:GITHUB_STEP_SUMMARY
          "| ---: | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          "| $([math]::Round($report.size.zipBytes / 1MB, 1)) | $([math]::Round($report.size.unpackedBytes / 1MB, 1)) | $($report.size.fileCount) |" >> $env:GITHUB_STEP_SUMMARY
      - name: Browser regression
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: releases/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          include-hidden-files: true
          path: |
            .release-work/unit-tests.xml
            releases/*.verification.json
            test-results/

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: releases
      - name: Create draft release
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          flags=(--draft)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
            TITLE="知序 v$version · Windows 便携预览"
          else
            TITLE="知序 v$version · Windows 便携版"
          fi
          gh release create "v$version" releases/* --target "$RELEASE_COMMIT" --title "$TITLE" "${flags[@]}" --notes-file packaging/release-notes.md
