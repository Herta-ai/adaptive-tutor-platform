name: Windows portable preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version (for example 0.1.0-alpha.1)
        required: true
        default: 0.1.0-alpha.1
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Disable Git autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Validate preview version
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$') { throw "Invalid release version: $version" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build portable ZIP without node_modules
        run: pnpm package:win --version "$env:RELEASE_VERSION"
      - name: Verify extracted ZIP using bundled Node and isolated user home
        run: pnpm verify:portable --zip "releases/adaptive-tutor-platform-v$env:RELEASE_VERSION-win-x64.zip"
      - name: Report artifact size
        shell: pwsh
        run: |
          $report = Get-Content "releases/adaptive-tutor-platform-v$env:RELEASE_VERSION-win-x64.zip.verification.json" -Raw | ConvertFrom-Json
          "| ZIP MiB | Unpacked MiB | Files |" >> $env:GITHUB_STEP_SUMMARY
          "| ---: | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          "| $([math]::Round($report.size.zipBytes / 1MB, 1)) | $([math]::Round($report.size.unpackedBytes / 1MB, 1)) | $($report.size.fileCount) |" >> $env:GITHUB_STEP_SUMMARY
      - name: Browser regression
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: releases/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            releases/*.verification.json
            test-results/

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: releases
      - name: Create release
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ "$version" =~ - ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="知序 v$version · Windows 便携预览"
          else
            PRERELEASE_FLAG=""
            TITLE="知序 v$version · Windows 便携版"
          fi
          gh release create "v$version" releases/* --target "$RELEASE_COMMIT" --title "$TITLE" --draft $PRERELEASE_FLAG --notes-file packaging/release-notes.md
